<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DRAFT Trade Explorer — synthetic</title><style>body{font:16px system-ui;max-width:1050px;margin:40px auto;padding:20px;color:#172533;background:#f7f9fc}h1{font-size:28px}.warning{background:#fff0cc;padding:16px;border-radius:8px}table{width:100%;border-collapse:collapse;background:white}td,th{padding:12px;text-align:left;border-bottom:1px solid #dde3eb}input,select{padding:10px;margin:12px 6px 18px 0}pre{white-space:pre-wrap;background:#eaf0f6;padding:16px}</style><h1>DRAFT Trade Explorer</h1><p class="warning">Offline synthetic prototype. No production connection. Finance remains separate. Records below are invented test fixtures, not St Ludaetuc trades.</p><label>Find signal/trade <input id="search" placeholder="demo-signal or demo-trade"></label><label>State <select id="state"><option>All</option><option>CLOSED</option><option>EXCEPTION</option></select></label><table><thead><tr><th>Signal</th><th>Trade</th><th>Instrument</th><th>Lifecycle</th><th>Evidence</th></tr></thead><tbody id="rows"></tbody></table><h2>Record details</h2><pre id="detail">Select a record.</pre><script>const data=[{signal_id:'demo-signal-1',broker_trade_id:'demo-trade-1',instrument:'GBPUSD',state:'CLOSED',evidence:'SYNTHETIC',prediction_linked:true,financial_result:'Finance verified contract required'},{signal_id:null,broker_trade_id:'demo-orphan',instrument:'XAUUSD',state:'EXCEPTION',evidence:'SYNTHETIC',reasons:['PREDICTION_MISSING'],financial_result:'Unavailable'}];function render(){const root=document.getElementById('rows');root.replaceChildren();for(const r of data){if(document.getElementById('state').value!=='All'&&r.state!==document.getElementById('state').value)continue;if(!JSON.stringify(r).includes(document.getElementById('search').value))continue;const tr=document.createElement('tr');for(const k of ['signal_id','broker_trade_id','instrument','state','evidence']){const td=document.createElement('td');td.textContent=r[k]??'UNKNOWN';tr.append(td)}tr.tabIndex=0;tr.onclick=()=>document.getElementById('detail').textContent=JSON.stringify(r,null,2);tr.onkeydown=e=>{if(e.key==='Enter')tr.click()};root.append(tr)}}document.getElementById('search').oninput=render;document.getElementById('state').onchange=render;render();</script></html>
