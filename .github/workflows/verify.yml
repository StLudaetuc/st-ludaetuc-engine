name: Verify only (no deployment)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - run: python -m pip install -r requirements.txt -r release/tests.lock
      - run: env -i PATH="$PATH" python -m unittest discover -s security/analytics_access_control -p 'test_*.py' -v
      - run: env -i PATH="$PATH" python -m unittest security.analytics_release.test_containment_fallback release.test_candidate release.local_probes operations.analytics_containment_release.test_tools operations.analytics_release_evidence_closure.test_evidence_checks -v
      - run: env -i PATH="$PATH" python operations/analytics_containment_release/rehearsal.py
      - run: python release/verify_release.py "$(git rev-parse HEAD)" release/RELEASE_MANIFEST.json --source-only
      - run: python -m pip install -r release/audit.lock
      - run: python -m pip_audit -r requirements.txt --no-deps --disable-pip --format json
      - name: Fetch hash-verified scanner and scan full history
        run: |
          curl -fLsS https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --log-opts=--all --redact --report-format json --report-path /tmp/gitleaks.json
